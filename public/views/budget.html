<!-- Personal Budget & Expenses View -->
<div class="budget-tracker-container" style="font-family: var(--font-thai); display: flex; flex-direction: column; gap: 1.5rem; animation: fadeIn 0.4s ease;">
    <div>
        <h3 style="margin: 0; font-size: 1.2rem; color: var(--text-main); font-weight: 600; display: flex; align-items: center; gap: 0.5rem;"><i data-lucide="wallet" style="color: var(--accent-green);"></i> บันทึกรายจ่ายรายวัน (Personal Budget)</h3>
        <p style="margin: 3px 0 0; font-size: 0.8rem; color: var(--text-muted);">จัดการการบันทึกรายรับ-รายจ่าย วิเคราะห์แผนการเงินรายวัน</p>
    </div>

    <!-- Stats summary row -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
        <div class="dashboard-card" style="padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1rem; border-left: 3px solid var(--accent-cyan);">
            <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(6, 182, 212, 0.1); color: var(--accent-cyan); display: flex; align-items: center; justify-content: center;"><i data-lucide="scale" style="width: 20px; height: 20px;"></i></div>
            <div>
                <span style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">ยอดคงเหลือปัจจุบัน</span>
                <h3 id="budget-balance" style="margin: 3px 0 0; font-size: 1.35rem; font-weight: 700; color: var(--accent-cyan);">0.00 บาท</h3>
            </div>
        </div>
        <div class="dashboard-card" style="padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1rem; border-left: 3px solid var(--accent-green);">
            <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(16, 185, 129, 0.1); color: var(--accent-green); display: flex; align-items: center; justify-content: center;"><i data-lucide="trending-up" style="width: 20px; height: 20px;"></i></div>
            <div>
                <span style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">รายรับวันนี้</span>
                <h3 id="budget-income-total" style="margin: 3px 0 0; font-size: 1.35rem; font-weight: 700; color: var(--accent-green);">0.00 บาท</h3>
            </div>
        </div>
        <div class="dashboard-card" style="padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1rem; border-left: 3px solid var(--accent-red);">
            <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(239, 68, 68, 0.1); color: var(--accent-red); display: flex; align-items: center; justify-content: center;"><i data-lucide="trending-down" style="width: 20px; height: 20px;"></i></div>
            <div>
                <span style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">รายจ่ายวันนี้</span>
                <h3 id="budget-expense-total" style="margin: 3px 0 0; font-size: 1.35rem; font-weight: 700; color: var(--accent-red);">0.00 บาท</h3>
            </div>
        </div>
    </div>

    <!-- Main Grid -->
    <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 1.25rem;">
        <!-- Add transaction card -->
        <div class="dashboard-card budget-tracker-card" style="display: flex; flex-direction: column; gap: 1rem; padding: 1.25rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
                <h4 style="margin: 0; font-size: 0.95rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 0.35rem;"><i data-lucide="plus-circle" style="width: 16px; height: 16px; color: var(--accent-green);"></i> บันทึกรายการใหม่</h4>
                <button id="btn-clear-budget" class="btn-icon-small" title="ล้างประวัติทั้งหมด" style="background:none; border:none; cursor:pointer; color:var(--text-muted);"><i data-lucide="refresh-cw" style="width:12px; height:12px;"></i></button>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label style="font-size: 0.75rem; color: var(--text-muted);">รายละเอียดรายการ</label>
                    <input type="text" id="budget-desc" class="form-control" style="font-size: 0.85rem;" placeholder="เช่น ค่าส้มตำมื้อเที่ยง, เงินเดือน">
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label style="font-size: 0.75rem; color: var(--text-muted);">หมวดหมู่</label>
                    <select id="budget-category" class="form-control" style="font-size: 0.85rem; background: rgba(0,0,0,0.2); color: white; border: 1px solid var(--border-color); border-radius: 8px;">
                        <option value="food">🍔 อาหาร</option>
                        <option value="travel">🚗 เดินทาง</option>
                        <option value="bills">⚡ ค่าประจำ</option>
                        <option value="shopping">🛍️ ช็อปปิ้ง</option>
                        <option value="other">🎸 อื่นๆ</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label style="font-size: 0.75rem; color: var(--text-muted);">จำนวนเงิน (บาท)</label>
                    <input type="number" id="budget-amount" class="form-control" style="font-family: var(--font-english); font-size: 0.95rem; font-weight: 600;" placeholder="0.00">
                </div>
            </div>

            <!-- Transaction Type Buttons -->
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin-top: 0.25rem;">
                <button id="btn-budget-expense" class="btn-secondary budget-type-btn active" data-type="expense" style="padding: 0.5rem 0; font-size: 0.8rem; background: rgba(239, 68, 68, 0.1); color: var(--accent-red); border-color: rgba(239, 68, 68, 0.2);">รายจ่าย</button>
                <button id="btn-budget-income" class="btn-secondary budget-type-btn" data-type="income" style="padding: 0.5rem 0; font-size: 0.8rem;">รายรับ</button>
                <button id="btn-add-budget" class="btn-primary" style="padding: 0.5rem 0; font-size: 0.8rem;">บันทึก</button>
            </div>
        </div>

        <!-- Expense logs card -->
        <div class="dashboard-card" style="padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; min-height: 320px;">
            <h4 style="margin: 0; font-size: 0.95rem; font-weight: 600; color: var(--text-main); border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">📋 ประวัติการทำรายการวันนี้</h4>
            
            <div class="budget-history" id="budget-history" style="flex-grow: 1; overflow-y: auto; max-height: 250px; border: 1px solid var(--border-color); border-radius: 8px; padding: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
                <!-- Dynamic history items -->
                <div class="text-muted" style="text-align: center; padding: 3rem 0;" id="budget-empty-msg">ยังไม่มีรายการบันทึกวันนี้</div>
            </div>
        </div>
    </div>
</div>
