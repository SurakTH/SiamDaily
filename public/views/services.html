<section class="tab-pane" id="tab-services">
    <!-- Header Block -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; font-family: var(--font-thai);">
        <div>
            <h2 style="margin:0; font-family:var(--font-thai); font-weight:600; font-size: 1.35rem; display: flex; align-items: center; gap: 0.6rem; color: var(--text-main); text-shadow: 0 2px 10px rgba(0,0,0,0.2);">
                <i data-lucide="network" class="text-cyan" style="width: 24px; height: 24px; filter: drop-shadow(0 0 8px var(--accent-cyan));"></i> 
                บริการ & ลิงก์ภายใน (Web Services)
            </h2>
            <p style="margin: 0.25rem 0 0; font-size: 0.8rem; color: var(--text-muted); font-family: var(--font-thai);">
                รวมทางลัดเพื่อเข้าถึงบริการภายในเซิร์ฟเวอร์ โฮมแล็บ หรือหน้าเว็บเครื่องมือที่คุณใช้งานเป็นประจำ (ซิงก์คลาวด์อัตโนมัติ)
            </p>
        </div>
        <button id="btn-add-service-modal" class="btn-primary" style="font-family: var(--font-thai); font-size: 0.8rem; padding: 0.6rem 1.2rem; border-radius: 10px; display: flex; align-items: center; gap: 0.4rem; cursor: pointer; border: none; color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); transition: all 0.2s ease;">
            <i data-lucide="plus-circle" style="width: 16px; height: 16px;"></i> เพิ่มลิงก์บริการ
        </button>
    </div>

    <!-- Controls Bar: Glassmorphic panel holding category filters & search input -->
    <div style="background: rgba(22, 28, 54, 0.35); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 14px; padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1.25rem; margin-bottom: 1.5rem; flex-wrap: wrap; font-family: var(--font-thai); box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
        <!-- Category Filters -->
        <div style="display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; -ms-overflow-style: none;" id="services-categories">
            <button class="btn-secondary active" data-category="all" style="font-size: 0.75rem; padding: 0.45rem 1rem; border-radius: 20px; white-space: nowrap; cursor: pointer; border: 1px solid var(--border-color); transition: all 0.2s;">
                ทั้งหมด <span id="count-all" style="margin-left: 3px; font-size: 0.65rem; opacity: 0.7; background: rgba(0,0,0,0.25); padding: 1px 6px; border-radius: 10px;">0</span>
            </button>
            <button class="btn-secondary" data-category="self-hosted" style="font-size: 0.75rem; padding: 0.45rem 1rem; border-radius: 20px; white-space: nowrap; cursor: pointer; border: 1px solid var(--border-color); transition: all 0.2s;">
                Self-Hosted <span id="count-self-hosted" style="margin-left: 3px; font-size: 0.65rem; opacity: 0.7; background: rgba(0,0,0,0.25); padding: 1px 6px; border-radius: 10px;">0</span>
            </button>
            <button class="btn-secondary" data-category="dev" style="font-size: 0.75rem; padding: 0.45rem 1rem; border-radius: 20px; white-space: nowrap; cursor: pointer; border: 1px solid var(--border-color); transition: all 0.2s;">
                เครื่องมือนักพัฒนา <span id="count-dev" style="margin-left: 3px; font-size: 0.65rem; opacity: 0.7; background: rgba(0,0,0,0.25); padding: 1px 6px; border-radius: 10px;">0</span>
            </button>
            <button class="btn-secondary" data-category="general" style="font-size: 0.75rem; padding: 0.45rem 1rem; border-radius: 20px; white-space: nowrap; cursor: pointer; border: 1px solid var(--border-color); transition: all 0.2s;">
                ทั่วไป <span id="count-general" style="margin-left: 3px; font-size: 0.65rem; opacity: 0.7; background: rgba(0,0,0,0.25); padding: 1px 6px; border-radius: 10px;">0</span>
            </button>
        </div>

        <!-- Search Bar -->
        <div style="position: relative; flex-grow: 1; max-width: 320px; min-width: 200px;">
            <i data-lucide="search" style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-muted); pointer-events: none;"></i>
            <input type="text" id="services-search-input" placeholder="ค้นหาบริการหรือลิงก์..." style="width: 100%; padding: 0.5rem 1rem 0.5rem 2.2rem; border-radius: 20px; border: 1px solid var(--border-color); background: rgba(0, 0, 0, 0.25); color: white; outline: none; font-size: 0.8rem; font-family: var(--font-thai); transition: all 0.2s;" onfocus="this.style.borderColor='var(--accent-cyan)'; this.style.boxShadow='0 0 8px rgba(6,182,212,0.25)';" onblur="this.style.borderColor='var(--border-color)'; this.style.boxShadow='none';">
        </div>
    </div>

    <!-- Services Grid -->
    <div class="services-grid" id="services-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem;">
        <!-- Dynamic Cards go here -->
    </div>

    <!-- Form Modal Popup for Add/Edit -->
    <div id="service-form-modal" class="cmd-palette-backdrop" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 16, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 10000; justify-content: center; align-items: center; font-family: var(--font-thai); padding: 1rem;">
        <div class="auth-modal-container" style="background: rgba(16, 22, 42, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 820px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; position: relative; animation: modalFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);">
            
            <!-- Modal Header -->
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding: 1.25rem 1.5rem; background: rgba(0, 0, 0, 0.15);">
                <h3 id="service-modal-title" style="margin: 0; font-size: 1.15rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 0.5rem;">
                    <i data-lucide="link" style="width: 20px; height: 20px; color: var(--accent-cyan); filter: drop-shadow(0 0 5px rgba(6, 182, 212, 0.4));"></i> 
                    <span id="service-modal-title-text">เพิ่มลิงก์บริการใหม่</span>
                </h3>
                <button id="btn-close-service-modal" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.5rem; line-height: 1; padding: 0; transition: color 0.2s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--text-muted)';" aria-label="Close">&times;</button>
            </div>
            
            <input type="hidden" id="service-id-field">

            <!-- Two-Column Layout (Form | Preview) -->
            <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 1.5rem; padding: 1.5rem; max-height: calc(90vh - 120px); overflow-y: auto;">
                
                <!-- Left: Form Fields -->
                <div style="display: flex; flex-direction: column; gap: 0.9rem;">
                    <div style="display: flex; flex-direction: column; gap: 0.3rem;">
                        <label style="font-size: 0.75rem; font-weight: 500; color: var(--text-muted);">ชื่อบริการ (Name) <span style="color: var(--accent-red);">*</span></label>
                        <input type="text" id="service-name-input" placeholder="เช่น Home Assistant, Portainer..." style="padding: 0.65rem 0.8rem; border-radius: 10px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.3); color: white; outline: none; font-size: 0.85rem; font-family: var(--font-thai); transition: all 0.2s;" onfocus="this.style.borderColor='var(--primary-color)';" onblur="this.style.borderColor='var(--border-color)';">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.3rem;">
                        <label style="font-size: 0.75rem; font-weight: 500; color: var(--text-muted);">ที่อยู่ URL <span style="color: var(--accent-red);">*</span></label>
                        <input type="text" id="service-url-input" placeholder="เช่น http://localhost:8123 หรือ https://..." style="padding: 0.65rem 0.8rem; border-radius: 10px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.3); color: white; outline: none; font-size: 0.85rem; font-family: var(--font-english); transition: all 0.2s;" onfocus="this.style.borderColor='var(--primary-color)';" onblur="this.style.borderColor='var(--border-color)';">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.3rem;">
                        <label style="font-size: 0.75rem; font-weight: 500; color: var(--text-muted);">คำอธิบายบริการ (Description)</label>
                        <input type="text" id="service-desc-input" placeholder="เช่น แผงควบคุมบ้านอัจฉริยะ, แดชบอร์ดมอนิเตอร์..." style="padding: 0.65rem 0.8rem; border-radius: 10px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.3); color: white; outline: none; font-size: 0.85rem; font-family: var(--font-thai); transition: all 0.2s;" onfocus="this.style.borderColor='var(--primary-color)';" onblur="this.style.borderColor='var(--border-color)';">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.3rem;">
                        <label style="font-size: 0.75rem; font-weight: 500; color: var(--text-muted);">ลิงก์รูปภาพโลโก้ (Image URL - ใส่เพื่อใช้โลโก้จริงแทนอีโมจิ)</label>
                        <input type="text" id="service-img-input" placeholder="https://... (ปล่อยว่างหากต้องการใช้เฉพาะไอคอนอีโมจิ)" style="padding: 0.65rem 0.8rem; border-radius: 10px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.3); color: white; outline: none; font-size: 0.85rem; font-family: var(--font-english); transition: all 0.2s;" onfocus="this.style.borderColor='var(--primary-color)';" onblur="this.style.borderColor='var(--border-color)';">
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 0.75rem;">
                        <div style="display: flex; flex-direction: column; gap: 0.3rem;">
                            <label style="font-size: 0.75rem; font-weight: 500; color: var(--text-muted);">ไอคอน / อีโมจิสำรอง</label>
                            <select id="service-icon-input" style="padding: 0.65rem 0.8rem; border-radius: 10px; font-size: 0.85rem; background: rgba(16, 22, 42, 0.9); color: white; border: 1px solid var(--border-color); outline: none; font-family: var(--font-thai); cursor: pointer; transition: all 0.2s;" onfocus="this.style.borderColor='var(--primary-color)';" onblur="this.style.borderColor='var(--border-color)';">
                                <option value="🏠">🏠 บ้าน (Home)</option>
                                <option value="🌐">🌐 เครือข่าย (Web)</option>
                                <option value="🐳">🐳 Docker / Container</option>
                                <option value="📸">📸 รูปภาพ (Media)</option>
                                <option value="⚡">⚡ ไฟฟ้า / พลังงาน</option>
                                <option value="🛡️">🛡️ ความปลอดภัย (Nginx)</option>
                                <option value="💾">💾 จัดเก็บข้อมูล (NAS)</option>
                                <option value="🛠️">🛠️ เครื่องมือ (Tools)</option>
                                <option value="📊">📊 กราฟ / สถิติ (Grafana)</option>
                                <option value="🍿">🍿 ความบันเทิง (Plex)</option>
                                <option value="☁️">☁️ คลาวด์ (Cloud)</option>
                                <option value="📝">📝 บันทึก (Notes)</option>
                                <option value="⚙️">⚙️ ตั้งค่า (Settings)</option>
                            </select>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 0.3rem;">
                            <label style="font-size: 0.75rem; font-weight: 500; color: var(--text-muted);">หมวดหมู่</label>
                            <select id="service-category-input" style="padding: 0.65rem 0.8rem; border-radius: 10px; font-size: 0.85rem; background: rgba(16, 22, 42, 0.9); color: white; border: 1px solid var(--border-color); outline: none; font-family: var(--font-thai); cursor: pointer; transition: all 0.2s;" onfocus="this.style.borderColor='var(--primary-color)';" onblur="this.style.borderColor='var(--border-color)';">
                                <option value="self-hosted">Self-Hosted</option>
                                <option value="dev">เครื่องมือนักพัฒนา</option>
                                <option value="general">ทั่วไป</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Right: Live Preview Panel -->
                <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; border-left: 1px solid var(--border-color); padding-left: 1.5rem; gap: 1rem; min-height: 250px; background: rgba(255,255,255,0.01); border-radius: 14px; padding: 1.5rem; border: 1px dashed var(--border-color); box-shadow: inset 0 0 10px rgba(0,0,0,0.2);">
                    <div style="font-size: 0.75rem; font-weight: 600; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 0.35rem;">
                        <i data-lucide="eye" style="width: 14px; height: 14px;"></i> พรีวิวการ์ดจริง (Live Preview)
                    </div>
                    
                    <!-- Preview Container -->
                    <div id="service-card-preview-container" style="width: 100%; max-width: 310px;">
                        <!-- The dynamically compiled card preview goes here -->
                    </div>
                    
                    <span style="font-size: 0.65rem; color: var(--text-muted); text-align: center; max-width: 240px; line-height: 1.4;">
                        นี่คือลักษณะที่การ์ดจะแสดงจริงบนหน้าเว็บเมื่อคุณบันทึกเรียบร้อย
                    </span>
                </div>
            </div>

            <!-- Modal Footer -->
            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; border-top: 1px solid var(--border-color); padding: 1rem 1.5rem; background: rgba(0, 0, 0, 0.15);">
                <button id="btn-cancel-service-modal" class="btn-secondary" style="font-family: var(--font-thai); font-size: 0.85rem; padding: 0.6rem 1.2rem; border-radius: 10px; cursor: pointer; border: 1px solid var(--border-color); color: var(--text-main); background: transparent;" onclick="document.getElementById('service-form-modal').style.display='none'">ยกเลิก</button>
                <button id="btn-save-service" class="btn-primary" style="font-family: var(--font-thai); font-size: 0.85rem; padding: 0.6rem 1.5rem; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);">บันทึกบริการ</button>
            </div>
        </div>
    </div>
</section>

<!-- Additional Custom Styles for Modal Fade In & Grid responsiveness -->
<style>
@keyframes modalFadeIn {
    from {
        opacity: 0;
        transform: scale(0.96) translateY(12px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}
@media (max-width: 768px) {
    .auth-modal-container > div {
        grid-template-columns: 1fr !important;
    }
    .auth-modal-container > div > div:nth-child(2) {
        border-left: none !important;
        padding-left: 0 !important;
        border-top: 1px dashed var(--border-color) !important;
        padding-top: 1.5rem !important;
    }
}
</style>
